worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_max_body_size 64k;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    # Proxy IPs are deliberately not trusted as client identities. Login account
    # throttling is in Redis; per-client-IP throttling belongs at Cloudflare.
    gzip on;
    gzip_types application/javascript application/json application/wasm text/css image/svg+xml;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        location = /metrics { return 404; }
        location ~ /\. { deny all; }
        location /api/ {
            set $api http://api:8000;
            proxy_pass $api;
            proxy_set_header Host $host;
            # This origin is private; Cloudflare terminates public HTTPS.
            # Never publish it directly as a public HTTP endpoint.
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 60s;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
        }
        location / {
            try_files $uri $uri/ /index.html;
            # Flutter filenames aren't all content-hashed; revalidate on update.
            expires -1;
        }
    }
}
