# Portainer Docker Standalone stack. All configuration is bundled in images.
# Generate secrets with configure.py; load that .env in Portainer.

x-api: &api
  image: ${FRAY_REGISTRY:-gitea.klanija.com/elitesalty}/fray-api:${FRAY_IMAGE_TAG:-release}
  platform: linux/amd64
  environment: &api-env
    FRAY_DEBUG: '0'
    FRAY_SECRET_KEY: ${FRAY_SECRET_KEY:?Run python3 configure.py first}
    FRAY_MFA_KEY: ${FRAY_MFA_KEY:?Run python3 configure.py first}
    FRAY_HOSTS: ${FRAY_DOMAIN:-frayapi.klanija.com},api,localhost
    FRAY_ORIGINS: https://${FRAY_DOMAIN:-frayapi.klanija.com}
    FRAY_DB_HOST: db
    FRAY_DB_NAME: fray
    FRAY_DB_USER: fray
    FRAY_DB_PASSWORD: ${FRAY_DB_PASSWORD:?Run python3 configure.py first}
    FRAY_REDIS_URL: redis://:${FRAY_REDIS_PASSWORD:?Run python3 configure.py first}@redis:6379/0
    FRAY_SIGNUP_ENABLED: ${FRAY_SIGNUP_ENABLED:-1}
    FRAY_SIGNUP_EMAIL_LIMIT: ${FRAY_SIGNUP_EMAIL_LIMIT:-100}
    FRAY_EMAIL_HOST: ${FRAY_EMAIL_HOST:-in-v3.mailjet.com}
    FRAY_EMAIL_PORT: ${FRAY_EMAIL_PORT:-587}
    FRAY_EMAIL_USER: ${FRAY_EMAIL_USER:-}
    FRAY_EMAIL_PASSWORD: ${FRAY_EMAIL_PASSWORD:-}
    FRAY_EMAIL_FROM: ${FRAY_EMAIL_FROM:-}
    FRAY_EMAIL_USE_TLS: ${FRAY_EMAIL_USE_TLS:-1}
    FRAY_EMAIL_USE_SSL: ${FRAY_EMAIL_USE_SSL:-0}
  networks: [backend]
  read_only: true
  tmpfs: ['/tmp:size=64m,mode=1777']
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging: &logging
    driver: json-file
    options: {max-size: 10m, max-file: '3'}

services:
  db:
    image: ${FRAY_REGISTRY:-gitea.klanija.com/elitesalty}/fray-db:${FRAY_IMAGE_TAG:-release}
    platform: linux/amd64
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: fray
      POSTGRES_PASSWORD: ${FRAY_POSTGRES_PASSWORD:?Run python3 configure.py first}
      FRAY_DB_PASSWORD: ${FRAY_DB_PASSWORD:?Run python3 configure.py first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d fray']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${FRAY_REDIS_PASSWORD:?Run python3 configure.py first}
    command: [sh, -c, 'exec redis-server --requirepass "$$REDIS_PASSWORD" --save "" --appendonly no --maxmemory 128mb --maxmemory-policy noeviction']
    networks: [backend]
    restart: unless-stopped
    read_only: true
    tmpfs: ['/data:size=16m,mode=1777']
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  migrate:
    <<: *api
    command: [python, manage.py, migrate, --noinput]
    restart: 'no'
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  api:
    <<: *api
    networks: [backend, mail]
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; r=urllib.request.Request('http://localhost:8000/api/health', headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r, timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: ${FRAY_REGISTRY:-gitea.klanija.com/elitesalty}/fray-web:${FRAY_IMAGE_TAG:-release}
    platform: linux/amd64
    ports:
      - '127.0.0.1:${FRAY_HTTP_PORT:-8090}:8080'
    networks:
      backend:
      edge:
        aliases: [fray-web]
    restart: unless-stopped
    read_only: true
    tmpfs: ['/tmp:size=64m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/']
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging

  prometheus:
    image: ${FRAY_REGISTRY:-gitea.klanija.com/elitesalty}/fray-monitoring:${FRAY_IMAGE_TAG:-release}
    platform: linux/amd64
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=15d]
    volumes:
      - prometheus-data:/prometheus
    ports: ['127.0.0.1:${FRAY_METRICS_PORT:-9090}:9090']
    networks: [backend, monitoring]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    depends_on:
      api: {condition: service_healthy}
    logging: *logging

volumes:
  postgres-data:
  prometheus-data:
networks:
  backend:
    internal: true
  monitoring:
  mail:
  edge:
    name: ${FRAY_EDGE_NETWORK:-fray-edge}
