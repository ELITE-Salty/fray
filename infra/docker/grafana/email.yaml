apiVersion: 1
contactPoints:
  - orgId: 1
    name: Fray email
    receivers:
      - uid: fray-email
        type: email
        disableResolveMessage: false
        settings:
          addresses: $FRAY_ALERT_EMAIL_TO
          singleEmail: true
policies:
  - orgId: 1
    receiver: Fray email
    group_by: [grafana_folder, alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
