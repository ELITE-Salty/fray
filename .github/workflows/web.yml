name: FRAY web checks
on:
  push:
    branches: [main, feat/blu-4-web]
  pull_request:
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate isolated CI configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import secrets
          text = Path('.env.example').read_text()
          text = text.replace('replace-with-at-least-50-random-characters', secrets.token_urlsafe(64))
          text = text.replace('replace-with-a-different-random-password', secrets.token_urlsafe(32))
          Path('.env').write_text(text)
          PY
      - name: Compose installation, PostgreSQL tests and restart persistence
        run: sh scripts/compose-verify.sh
      - name: Container status on failure
        if: failure()
        run: |
          docker compose -p fray-ci ps -a
          docker compose -p fray-ci logs --tail 80 web
