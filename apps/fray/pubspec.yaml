name: fray
description: Private time tracking for projects and everyday activities.
publish_to: none
version: 0.2.1+3

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  intl: ^0.20.3
  web: ^1.1.2
  flutter_localizations:
    sdk: flutter
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  flutter_secure_storage: ^11.2.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.6
  share_plus: ^13.3.1
  pdf: ^3.13.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
